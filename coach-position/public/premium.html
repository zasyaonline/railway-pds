<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coach Position — Premium</title>
  <link rel="icon" href="/img/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=20260822p">
  <link rel="stylesheet" href="/css/premium.css?v=20260822p">
</head>
<body class="theme-premium">
  <header class="header">
    <div class="header-left">
      <img src="/img/ir-logo.png" alt="Indian Railways" class="logo">
      <div>
        <h1 id="stationTitle">COACH POSITION</h1>
        <p class="subtitle" id="displayName"></p>
      </div>
    </div>
    <div class="header-right">
      <div class="clock" id="clock">--:--:--</div>
      <div class="clock-date" id="clockDate"></div>
      <div class="lang" id="langLabel">EN</div>
    </div>
  </header>

  <main class="board" id="board">
    <p class="loading" id="bootLoading">Loading coach positions…</p>
  </main>

  <footer class="footer">
    <span id="footerMeta">Coach Position</span>
    <span id="footerWindow">Window: T−10 until departure</span>
    <a class="theme-link" id="themeLink" href="/?station=BG&display=entrance-main">Current TV</a>
    <a class="admin-link" href="/admin.html">Admin</a>
  </footer>

  <script src="/config.js"></script>
  <script src="/js/i18n.js?v=20260822p"></script>
  <script src="/js/app.js?v=20260822p"></script>
</body>
</html>
